name: Fix AFW config screen 1.21.1 constructor

on:
  push:
    branches:
      - port/1.21.1-neoforge
    paths:
      - .github/workflows/fix-afw-config-screen.yml

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore original screen and apply one-line 1.21.1 fix
        shell: bash
        run: |
          set -euo pipefail
          path='animationdirector/src/main/java/com/afwid/client/config/AfwConfigScreen.java'
          git show 21422e734061b12553355056631091b6bbd7c680:"$path" > "$path"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('animationdirector/src/main/java/com/afwid/client/config/AfwConfigScreen.java')
          s = p.read_text()
          old = '            super(client, width, top + height, top, top + height, 24);'
          new = '            super(client, width, height, top, 24);'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old constructor, got {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/fix-afw-config-screen.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'port: fix AFW config screen for 1.21.1'
          git push origin HEAD:port/1.21.1-neoforge

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afw-config-fix-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeedsOfNature-1.21.1-NeoForge-after-afw-fix
          path: |
            animationdirector/build/libs/*.jar
            needsofnature/build/libs/*.jar
          if-no-files-found: error