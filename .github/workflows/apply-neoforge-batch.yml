name: Apply native NeoForge AFW migration batch

on:
  push:
    branches:
      - port/1.21.1-neoforge
    paths:
      - .github/workflows/apply-neoforge-batch.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply migration batch
        shell: bash
        run: |
          cat > /tmp/port-batch.patch.gz.b64 <<'B64'
          [... ELLIPSIZATION ...]
          B64
          base64 -d /tmp/port-batch.patch.gz.b64 | gzip -d > /tmp/port-batch.patch
          git apply --index /tmp/port-batch.patch
          git status --short

      - name: Commit migration batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'port: migrate Animation Director core to native NeoForge 1.21.1'
          git push origin HEAD:port/1.21.1-neoforge

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build migrated branch
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-native-batch-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeedsOfNature-1.21.1-NeoForge-native-batch
          path: |
            animationdirector/build/libs/*.jar
            needsofnature/build/libs/*.jar
          if-no-files-found: error