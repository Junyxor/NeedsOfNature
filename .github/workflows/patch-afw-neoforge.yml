name: Reset AFW 1.21.1 baseline and build

on:
  push:
    branches:
      - port/1.21.1-neoforge
    paths:
      - .github/workflows/patch-afw-neoforge.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore 1.21.1-compatible AFW source baseline
        shell: bash
        run: |
          git checkout a8167b91034d3b316b3eed76446267f4fd139c4c -- animationdirector/src/main/java
          cat > animationdirector/src/main/java/com/afwid/network/AfwPacket.java <<'JAVA'
          package com.afwid.network;

          import net.minecraft.network.packet.CustomPayload;

          /** Legacy compatibility marker while the old Fabric byte-buffer layer is removed. */
          @Deprecated(forRemoval = true)
          public interface AfwPacket extends CustomPayload {
          }
          JAVA

      - name: Commit corrected baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add animationdirector/src/main/java
          if ! git diff --cached --quiet; then
            git commit -m 'port: restore GeckoLib 4 compatible AFW baseline for 1.21.1'
            git push origin HEAD:port/1.21.1-neoforge
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build corrected branch
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-afw-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeedsOfNature-1.21.1-NeoForge-corrected
          path: |
            animationdirector/build/libs/*.jar
            needsofnature/build/libs/*.jar
          if-no-files-found: error
