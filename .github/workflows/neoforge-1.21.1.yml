name: NeoForge 1.21.1 build

on:
  push:
    branches:
      - port/1.21.1-neoforge
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: neoforge-1.21.1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeedsOfNature-1.21.1-NeoForge
          path: |
            animationdirector/build/libs/*.jar
            needsofnature/build/libs/*.jar
          if-no-files-found: error
